title: Mysticism Journal
description: Essays on Sufi literature, mysticism, and the enduring wisdom of the heart.
url: "https://mysticismjournal.com"
baseurl: ""
lang: en
timezone: UTC
markdown: kramdown
permalink: /:title.html
paginate: 6
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Mysticism Journal
      image: /assets/images/editorial-motif.svg
