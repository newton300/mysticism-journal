<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ee">
  <meta name="color-scheme" content="light">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">Mysticism Journal</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="primary-navigation" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/essays/' | relative_url }}" {% if page.url contains '/essays' %}aria-current="page"{% endif %}>Essays</a>
      <a href="{{ '/traditions/' | relative_url }}" {% if page.url contains '/traditions' %}aria-current="page"{% endif %}>Traditions</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <a class="footer-title" href="{{ '/' | relative_url }}">Mysticism Journal</a>
    <p>A literary journal exploring Sufi poetry, stories, and the inner life.</p>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="{{ '/essays/' | relative_url }}">Essays</a>
      <a href="{{ '/traditions/' | relative_url }}">Traditions</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    <div class="footer-bottom">© {{ 'now' | date: '%Y' }} Mysticism Journal. All rights reserved.</div>
  </footer>
  <script>
    (() => {
      const button = document.querySelector('.menu-toggle');
      const navigation = document.querySelector('.site-nav');
      if (!button || !navigation) return;
      button.addEventListener('click', () => {
        const isOpen = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!isOpen));
        button.setAttribute('aria-label', isOpen ? 'Open menu' : 'Close menu');
        navigation.classList.toggle('is-open', !isOpen);
      });
      navigation.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          button.setAttribute('aria-expanded', 'false');
          button.setAttribute('aria-label', 'Open menu');
          navigation.classList.remove('is-open');
        }
      });
    })();
  </script>
</body>
</html>
